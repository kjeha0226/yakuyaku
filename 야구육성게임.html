<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>야구 육성 게임</title>
<meta name="theme-color" content="#2b723f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --g1:#2f7a43;--g2:#2b723f;--panel:#12301f;--panel2:#0c2115;
  --chalk:#f3f1e7;--mute:#9fc0a8;--amber:#f2b705;--amberink:#2b2100;
  --bad:#ff7a6b;--fill:#7ed37f;--cute:"Jua","Gowun Dodum","Apple SD Gothic Neo",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --g1:#1c4a2b;--g2:#194427;--panel:#0d2216;--panel2:#08170e;color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --g1:#1c4a2b;--g2:#194427;--panel:#0d2216;--panel2:#08170e;color-scheme:dark
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,summary{touch-action:manipulation;min-height:44px}
*{box-sizing:border-box}
body{
  margin:0;
  background:repeating-linear-gradient(90deg,var(--g1) 0 56px,var(--g2) 56px 112px);
  color:var(--chalk);
  font:17px/1.55 "Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif
}
main{max-width:520px;margin:0 auto;padding:24px 16px 64px}
main.has-dock{padding-bottom:150px}
h1,h2,details.card>summary,.go,.fast-btn,.board b,.cand b,.tn,.tile .nm,.tile .pr,.award.big,.trait-badge,.ceremony-title,.jersey-num{font-family:var(--cute)}
h1{font-size:34px;line-height:1.15;margin:4px 0 2px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
h2{font-size:20px;margin:0 0 12px;color:var(--amber)}
.sub{margin:0 0 18px;opacity:.92}
.card{
  background:var(--panel);
  border:3px solid var(--chalk);
  border-radius:14px;
  padding:16px;
  margin-bottom:18px;
  box-shadow:0 5px 0 rgba(0,0,0,.28);
  position:relative
}
.card.slim{padding:12px;border-width:2px;border-radius:12px;margin-bottom:14px;box-shadow:0 4px 0 rgba(0,0,0,.28)}
label{display:block;font-weight:400;margin:14px 0 6px;color:var(--mute)}
label:first-child{margin-top:0}
input,select{
  width:100%;padding:11px 12px;
  border:2px solid rgba(243,241,231,.35);
  border-radius:10px;
  background:var(--panel2);
  color:var(--chalk);
  font:inherit
}
button{
  font:inherit;font-weight:400;cursor:pointer;
  border-radius:10px;
  border:2px solid rgba(243,241,231,.45);
  background:var(--panel2);
  color:var(--chalk);
  padding:9px 14px;
  box-shadow:0 4px 0 rgba(0,0,0,.45);
  transition:transform .06s,box-shadow .06s
}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1 1 40%}
.chip{display:flex;align-items:center;justify-content:center;gap:8px}
.chip svg{flex:none}
.scr{max-height:260px;overflow:auto;padding:2px}
.acc{border:2px solid rgba(243,241,231,.3);border-radius:10px;margin-top:10px;background:var(--panel2)}
.acc>summary,details.card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
.acc>summary{padding:12px 14px;color:var(--mute)}
.acc>summary::-webkit-details-marker,details.card>summary::-webkit-details-marker{display:none}
.acc>summary::after,details.card>summary::after{content:"▾";color:var(--chalk)}
.acc[open]>summary::after,details.card[open]>summary::after{content:"▴"}
.acc>summary b{margin-left:auto;font-weight:400;color:var(--chalk)}
.acc>.row,.acc>.scr{padding:0 12px 12px}
details.card>summary{font-size:20px;color:var(--amber);justify-content:space-between}
details.card[open]>summary{margin-bottom:12px}
details.card.slim>summary{font-size:17px;min-height:36px}
details.card.slim[open]>summary{margin-bottom:8px}
.cands{display:grid;gap:10px}
.cand{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;gap:4px;padding:12px 14px}
.cand b{font-size:20px}
.cand span{opacity:.9;font-size:14px}
.cand small{opacity:.8;font-size:12px}
#rr{width:100%;margin-top:14px}
.mini{display:grid;gap:5px;width:100%;margin-top:6px}
.cand .ms{display:grid;grid-template-columns:44px 1fr 26px;gap:8px;align-items:center;font-size:12px}
.cand .ms span,.cand .ms b{opacity:1;font-size:12px;font-weight:400}
.cand .ms .bar{display:block;height:10px;border-width:1px;background:rgba(0,0,0,.35)}
.cand.sel .ms .bar{background:rgba(18,48,31,.18);border-color:rgba(18,48,31,.5)}
.cand.sel .ms .bar i{background:#2f7a43}
.acc>summary:focus-visible,details.card>summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.sel{background:var(--chalk);color:var(--panel);border-color:var(--chalk)}
.go{
  width:100%;margin-top:18px;padding:14px;
  font-size:18px;
  background:var(--amber);border-color:#ffd95e;color:var(--amberink)
}
.fast-btn{
  width:100%;margin-top:10px;padding:11px;
  font-size:16px;
  background:rgba(242,183,5,.18);border-color:var(--amber);color:var(--amber)
}
.board{
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--panel2);border:3px solid var(--chalk);
  border-radius:14px;margin-bottom:18px;
  box-shadow:0 5px 0 rgba(0,0,0,.28);padding:12px 0
}
.board>div{text-align:center;border-left:2px solid rgba(243,241,231,.2)}
.board>div:first-child{border-left:0}
.board b{display:block;font-size:28px;line-height:1.1;color:var(--amber)}
.board span{font-size:12px;color:var(--mute)}
.stat{display:grid;grid-template-columns:56px 1fr 32px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.stat span{color:var(--mute)}
.bar{height:14px;background:var(--panel2);border:2px solid rgba(243,241,231,.3);border-radius:4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--fill);transition:width .25s ease}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(0,0,0,.4) 8px 10px)}
.stat.f .bar i{background:var(--amber)}
ul{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
li{padding:9px 0;border-bottom:1px solid rgba(243,241,231,.15);font-size:14px}
li:last-child{border:0}
.bad{color:var(--bad)}.gold{color:var(--amber);font-weight:700}
.hint{font-size:13px;color:var(--mute);margin:10px 0 0}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.metric{background:var(--panel2);border:1px solid rgba(243,241,231,.2);border-radius:9px;padding:10px}
.metric span{display:block;color:var(--mute);font-size:12px}
.metric b{font-size:19px;color:var(--chalk)}
.report-table{width:100%;border-collapse:collapse;font-size:14px}
.report-table td{padding:8px 4px;border-bottom:1px solid rgba(243,241,231,.15)}
.report-table td:last-child{text-align:right;font-weight:bold}
.report-table tr:last-child td{border-bottom:0}
.award{padding:12px;border:2px solid var(--amber);border-radius:10px;margin:8px 0;background:rgba(242,183,5,.08)}
.award.big{background:linear-gradient(135deg,rgba(242,183,5,.28),rgba(242,183,5,.08));font-size:19px;padding:12px 14px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.award.big small{display:block;font:400 12px "Gowun Dodum",sans-serif;color:var(--mute);margin-top:2px}
.match{padding:10px;border-bottom:1px solid rgba(243,241,231,.15);font-size:14px}
.match:last-child{border:0}

/* 하단 고정 시즌 진행 독 */
.bottom-dock{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(8,23,14,.95);
  backdrop-filter:blur(8px);
  border-top:3px solid var(--chalk);
  padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -6px 20px rgba(0,0,0,.45)
}
.bottom-dock-inner{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bottom-dock .go{margin-top:0;flex:2;padding:13px 10px;font-size:17px}
.bottom-dock .fast-btn{margin-top:0;flex:1;padding:13px 8px;font-size:15px}

/* 특수 능력 배지 & 훈련 칩 */
.trait-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.trait-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:999px;font-size:12px;
  background:rgba(242,183,5,.16);border:1px solid var(--amber);color:var(--amber)
}
.train-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.train-btn{padding:8px 4px;font-size:13px;text-align:center}
.train-btn.sel{background:var(--amber);color:var(--amberink);border-color:#ffd95e;font-weight:bold}

/* 포스트시즌 실시간 경기 중계 스타일 */
.scoreboard{
  width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;
  background:var(--panel2);border:2px solid rgba(243,241,231,.4);border-radius:8px;overflow:hidden
}
.scoreboard th,.scoreboard td{padding:6px 3px;text-align:center;border:1px solid rgba(243,241,231,.15)}
.scoreboard th{background:rgba(255,255,255,.06);color:var(--mute);font-weight:400}
.scoreboard td.team-col{text-align:left;padding-left:6px;font-weight:bold;max-width:85px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scoreboard td.runs-col{color:var(--amber);font-weight:bold;font-size:15px}
.inning-badge{
  display:inline-block;padding:4px 12px;border-radius:999px;
  background:var(--amber);color:var(--amberink);font-weight:bold;font-size:14px;margin-bottom:8px
}
.pbp-feed{
  background:var(--panel2);border:2px solid rgba(243,241,231,.25);border-radius:10px;
  padding:10px 12px;height:240px;overflow-y:auto;overscroll-behavior:contain;margin:10px 0;text-align:left
}
.pbp-item{padding:6px 0;border-bottom:1px dashed rgba(243,241,231,.14);font-size:14px;line-height:1.45}
.pbp-item:last-child{border-bottom:0}
.pbp-hero{color:var(--amber);font-weight:bold}
.pbp-bad{color:var(--bad)}

/* 시뮬레이션 화면 스타일 */
.sim-container{text-align:center;padding:16px 4px}
.sim-badge{
  display:inline-block;padding:4px 12px;border-radius:999px;
  background:rgba(242,183,5,.16);border:1px solid var(--amber);
  color:var(--amber);font-size:13px;margin-bottom:10px
}
.sim-progress{
  height:22px;background:var(--panel2);
  border:2px solid rgba(243,241,231,.45);
  border-radius:11px;overflow:hidden;margin:14px 0 8px;position:relative
}
.sim-progress-bar{
  height:100%;
  background:linear-gradient(90deg,#7ed37f,var(--amber));
  width:0%;transition:width 0.35s ease
}
.sim-stage-title{min-height:30px;font-size:19px;color:var(--chalk);margin:8px 0 4px}
.sim-log{font-size:14px;color:var(--mute);min-height:44px;margin-bottom:14px}
.sim-feed{
  text-align:left;background:var(--panel2);
  border:1px solid rgba(243,241,231,.2);border-radius:10px;
  padding:10px 12px;margin-bottom:14px;height:170px;overflow-y:auto;overscroll-behavior:contain
}
.sim-feed div{font-size:13px;padding:4px 0;border-bottom:1px dashed rgba(243,241,231,.12)}
.sim-feed div:last-child{border-bottom:0}

/* 탑3 리더보드 스타일 */
.leader-box{background:var(--panel2);border:1px solid rgba(243,241,231,.2);border-radius:10px;padding:10px 12px;margin-top:10px}
.leader-box h3{margin:0 0 8px;font:400 15px "Gowun Dodum",sans-serif;color:var(--amber)}
.leader-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:14px;border-bottom:1px solid rgba(243,241,231,.1)}
.leader-row:last-child{border-bottom:0}
.leader-me{color:var(--amber);font-weight:bold}

input.err{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--panel2))}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.74);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadein .25s}
.ov .card{width:100%;max-width:460px;margin:0;max-height:88vh;overflow:auto;animation:pop .3s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.rx{opacity:0;transform:translateY(14px) scale(.96);transition:opacity .5s,transform .5s}.rx.on{opacity:1;transform:none}
.art{border-left:4px solid var(--amber);padding:2px 0 2px 12px;margin:6px 0 12px}
.art .tag{font-size:12px;color:var(--amber)}.art h3{font:400 24px/1.3 'Gowun Dodum','Apple SD Gothic Neo',sans-serif;margin:6px 0}.art p{margin:6px 0;font-size:14px;color:var(--mute)}
.emos{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.emo{background:var(--panel2);border:1px solid rgba(243,241,231,.25);border-radius:999px;padding:4px 10px;font-size:14px}
.cm{padding:9px 0;border-top:1px solid rgba(243,241,231,.12);font-size:14px}.cm i{float:right;font-style:normal;color:var(--mute);font-size:12px}
.errmsg{color:var(--bad);font-size:14px;margin:6px 0 0}

/* 상점 · 계약 · FA 협상 UI */
.purse{font:400 14px var(--cute);color:var(--chalk);background:rgba(242,183,5,.16);border:1px solid var(--amber);border-radius:999px;padding:1px 10px;margin-left:auto}
.tn{font-size:17px;line-height:1.2}
.lg{font-size:11.5px;color:var(--mute)}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.pill{font-size:12px;line-height:1.5;padding:1px 9px;border-radius:999px;background:rgba(243,241,231,.08);border:1px solid rgba(243,241,231,.25)}
.pill.money{color:var(--amber);border-color:var(--amber);background:rgba(242,183,5,.12)}
.pill.opt{color:#7ed37f;border-color:#7ed37f;background:rgba(126,211,127,.12)}
.ct-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.offers{display:grid;gap:10px}
.offer{display:grid;grid-template-columns:30px 1fr;gap:8px 10px;align-items:center;padding:12px;border-radius:12px;
  border:2px solid rgba(243,241,231,.35);background:var(--panel2);box-shadow:0 3px 0 rgba(0,0,0,.4)}
.offer.home{border-color:var(--amber)}
.offer .pills,.offer .act{grid-column:1/-1}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act button,button.small{min-height:38px;padding:6px 8px;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.45)}
button.small{width:100%;margin-top:8px}
button.ghost{width:100%;margin-top:12px;min-height:36px;padding:6px;font-size:13px;background:transparent;border-style:dashed;box-shadow:none;color:var(--mute)}

/* FA 등급 배지 및 옵션 토글 */
.fa-grade-box{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;
  background:linear-gradient(135deg,rgba(242,183,5,.22),rgba(12,33,21,.9));
  border:2px solid var(--amber);margin-bottom:10px
}
.fa-grade-badge{
  min-width:54px;height:54px;border-radius:12px;background:var(--amber);color:var(--amberink);
  display:flex;align-items:center;justify-content:center;font:400 26px var(--cute);box-shadow:0 3px 0 rgba(0,0,0,.4)
}
.opt-toggle{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;text-align:left;padding:10px 12px;margin-top:8px;border-radius:10px;
  border:2px solid rgba(243,241,231,.3);background:var(--panel2)
}
.opt-toggle.on{border-color:var(--amber);background:rgba(242,183,5,.14)}
.opt-toggle b{display:block;font-size:15px;color:var(--chalk)}
.opt-toggle small{display:block;font-size:12px;color:var(--mute)}
.opt-check{font-size:18px;color:var(--amber)}
.nego-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;background:var(--panel2);padding:8px 12px;border-radius:10px;border:1px solid rgba(243,241,231,.2)}
.nego-btns{display:flex;gap:6px}
.nego-btns button{min-height:34px;padding:4px 12px;font-size:15px}

/* 상점 리스트 */
.shoplist{display:grid;gap:6px}
.srow{display:flex;align-items:center;gap:8px;text-align:left;padding:6px 10px;min-height:40px;border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.srow .ic{font-size:18px}.srow .tx{flex:1;min-width:0}
.srow .nm{display:block;font:15px/1.2 var(--cute)}.srow .ds{display:block;font-size:11px;line-height:1.25;color:var(--mute)}
.srow .pr{font:13px var(--cute);color:var(--amber);border:1px solid var(--amber);border-radius:999px;padding:1px 9px;white-space:nowrap;background:rgba(242,183,5,.14)}
.srow.own .pr{color:var(--fill);border-color:var(--fill)}
.srow:disabled:not(.own){opacity:.55}

/* 은퇴식 화려한 연출 및 영구결번 배너 애니메이션 */
.ceremony-stage{
  text-align:center;padding:22px 14px;border-radius:16px;overflow:hidden;position:relative;
  background:radial-gradient(circle at top,rgba(242,183,5,.28),rgba(8,23,14,.96) 72%);
  border:3px solid var(--amber);box-shadow:0 8px 24px rgba(0,0,0,.55)
}
.ceremony-stage.legend{
  background:radial-gradient(circle at top,rgba(255,215,0,.38),rgba(18,48,31,.98) 75%);
  box-shadow:0 0 28px rgba(242,183,5,.45)
}
.ceremony-sub{font-size:13px;color:var(--amber);letter-spacing:1px;margin-bottom:6px}
.ceremony-title{font-size:26px;color:var(--chalk);margin:4px 0 12px;text-shadow:0 3px 0 rgba(0,0,0,.45)}
.jersey-banner{
  width:136px;margin:14px auto;padding:16px 10px 22px;
  background:linear-gradient(180deg,#1a472a,#0d2616);
  border:3px solid var(--amber);
  clip-path:polygon(0 0,100% 0,100% 84%,50% 100%,0 84%);
  box-shadow:0 10px 20px rgba(0,0,0,.5);
  animation:bannerDrop .85s cubic-bezier(.22,1.25,.36,1) both
}
@keyframes bannerDrop{
  0%{opacity:0;transform:translateY(-40px) scale(.8)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.jersey-team{font-size:12px;color:var(--mute);margin-bottom:2px}
.jersey-num{font-size:48px;line-height:1;color:var(--amber);text-shadow:0 3px 0 rgba(0,0,0,.5);animation:goldPulse 2s infinite}
@keyframes goldPulse{
  0%,100%{filter:drop-shadow(0 0 4px rgba(242,183,5,.4))}
  50%{filter:drop-shadow(0 0 14px rgba(242,183,5,.95))}
}
.jersey-name{font-size:15px;color:var(--chalk);margin-top:4px;font-weight:bold}
.ending-emblem{
  font-size:54px;line-height:1.1;margin:10px 0;
  animation:emblemFloat 2.4s ease-in-out infinite
}
@keyframes emblemFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-6px) scale(1.06)}
}
.ending-card{
  background:linear-gradient(135deg,rgba(242,183,5,.25),rgba(126,211,127,.12));
  border:2px solid var(--amber);border-radius:12px;padding:14px;margin:12px 0;text-align:left
}
.ending-card h3{margin:0 0 6px;font:400 19px var(--cute);color:var(--amber)}
.ending-card p{margin:0;font-size:14px;line-height:1.5;color:var(--chalk)}
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti-piece{
  position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;
  animation:confettiFall linear forwards
}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  85%{opacity:1}
  100%{transform:translateY(105vh) rotate(720deg);opacity:0}
}

function getHof(){

      players:[],
      records:{
        hr:{val:0,name:"-"},hit:{val:0,name:"-"},rbi:{val:0,name:"-"},
        win:{val:0,name:"-"},so:{val:0,name:"-"},mvp:{val:0,name:"-"},champ:{val:0,name:"-"}
      }
    };
  }catch(e){
    return {players:[],records:{hr:{val:0,name:"-"},hit:{val:0,name:"-"},rbi:{val:0,name:"-"},win:{val:0,name:"-"},so:{val:0,name:"-"},mvp:{val:0,name:"-"},champ:{val:0,name:"-"}}};
  }
}

function calcCareerTotals(stObj){
  const ys=stObj.yearStats||[];
  const t={G:0,H:0,HR:0,RBI:0,SB:0,W:0,L:0,SO:0,IP:0,AB:0,ER:0,champs:0,gg:0};
  ys.forEach(r=>{
    const s=r.stats||{};
    t.G+=(s.G||0);
    if(stObj.type==="타"){
      t.H+=(s.H||0);t.HR+=(s.HR||0);t.RBI+=(s.RBI||0);t.SB+=(s.SB||0);t.AB+=(s.AB||0);
    }else{
      t.W+=(s.W||0);t.L+=(s.L||0);t.SO+=(s.SO||0);t.IP+=(s.IP||0);t.ER+=(s.ER||0);
    }
    if(r.champion)t.champs++;
    if((r.awards||[]).includes("골든글러브"))t.gg++;
  });
  return t;
}

function R(min,max){return Math.random()*(max-min)+min}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function ovr(s){return Math.round(s.st.reduce((a,b)=>a+b,0)/6)}
function games(o){return Math.round(clamp(40+(o-35)*1.8,20,144))}
function tier(o){
  return o>=80?"리그 슈퍼스타":o>=70?"특급 주전 선수":o>=60?"평균 이상 주전":o>=50?"백업 및 로테이션":o>=42?"2군 유망주":"방출 위기 선수";
}

// 8. 선수 생성 및 스타일 뽑기 로직
function mk(pos,hand,style){
  const type=pos==="투수"?"투":"타";
  const st=[25,25,25,25,25,25];
  const ad=(i,v)=>{st[i]=clamp(st[i]+v,10,99)};
  (POS[pos]||[]).forEach((v,i)=>ad(i,v));
  (STY[type][style]||[]).forEach((v,i)=>ad(i,v));
  if(type==="투"&&hand[0]==="좌"){ad(1,2);ad(0,-2)}
  if(type==="타"&&hand[2]==="좌"){ad(0,2);ad(1,-2)}
  if(type==="타"&&hand[2]==="양"){ad(0,2);ad(3,2);ad(1,-2);ad(4,-2)}
  return st;
}

function roll(){
  const ks=Object.keys(STY[P.pos==="투수"?"투":"타"]);
  for(let i=ks.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [ks[i],ks[j]]=[ks[j],ks[i]];
  }
  P.cand=ks.slice(0,3);
}

function toDraft(n){
  const col=S.phase==="college";
  const sc=n+R(-6,6);
  const r=sc>=52?"1라운드 지명":sc>=46?"2~3라운드 지명":sc>=40?"4라운드 이하 지명":"미지명";
  S.league=leagueOf();
  S.drafted=sc>=40;
  S.dr=r;
  S.fromCol=col;
  S.phase="draft";
  S.screen="career";
  S.draftTeam=S.drafted?CLUBS[S.league][Math.floor(Math.random()*CLUBS[S.league].length)]:null;
  S.draftRound=S.drafted?(sc>=52?1:sc>=46?Math.floor(R(2,4)):Math.floor(R(4,9))):null;
  S.log.unshift(`<b>${S.age}세</b> ${LEAGUE_LABEL[S.league]} 드래프트: <span class="gold">${r}</span>${S.draftTeam?` · ${S.draftTeam}`:""}`);
}

function isFaYear(){
  return (S.contractRemaining||0)<=0;
}

// 옵트아웃 조항 발동 가능 여부 (계약 1~2년차 소화 후 잔여 계약이 1년 이상일 때)
function canTriggerOptOut(){
  const opt=S.contractOpts||{};
  if(!opt.optOut||isFaYear())return false;
  const elapsed=(S.contractYears||1)-(S.contractRemaining||0);
  return elapsed>=opt.optOut;
}

function triggerOptOut(){
  if(!canTriggerOptOut())return;
  S.contractRemaining=0;
  S.contractOpts={optOut:0,incentive:false,noTrade:false};
  S.log.unshift(`<b>${S.age}세</b> 🚪 <span class="gold">옵트아웃(Opt-Out) 권리 행사!</span> 잔여 계약을 파기하고 FA 시장에 재진입합니다.`);
  makeOffers();addOverseas();
  S.screen=S.offers.length?"offers":"nooffer";
  if(!S.offers.length)S.rejects=makeRejects();
  render();
}

// FA 시장 종합 스카우트 평가 산출
function evaluateFaMarket(){
  const o=ovr(S),a=S.age,rc=S.seasonRecord||{};
  const war=(rc.stats&&rc.stats.WAR)||0;
  const score=o+(war*2.5)-Math.max(0,a-30)*1.6-(rc.injLv>=3?8:rc.injLv===2?4:0);
  let grade="C급",title="베테랑 백업 자원",desc="경험은 풍부하지만 나이와 기량 면에서 단기 계약 위주의 오퍼가 예상됩니다.";
  if(score>=82){
    grade="S급";title="리그 최고 특급 대어";
    desc="전 구단이 탐내는 프랜차이즈 슈퍼스타! 초대형 장기 계약과 각종 옵션 요구가 가능합니다.";
  }else if(score>=71){
    grade="A급";title="핵심 주전 준척급 FA";
    desc="확실한 주전급 기량을 검증받았습니다. 복수 구단의 경쟁 입찰을 유도할 수 있습니다.";
  }else if(score>=60){
    grade="B급";title="실속파 1군 전력감";

  }

function calcNegoSuccessProb(ns){
  const salRatio=ns.salary/Math.max(1,ns.baseSalary);
  const yrDiff=ns.years-ns.baseYears;
  let prob=0.82;
  // 연봉 인상 요구할수록 확률 하락, 깎아주면 확률 상승
  prob-=(salRatio-1)*1.45;
  // 기간 요구에 따른 보정
  prob-=Math.abs(yrDiff)*0.08;
  // 옵션 요구에 따른 난이도
  if(ns.optOut>0)prob-=0.14;
  if(ns.noTrade)prob-=0.12;
  // 인센티브 포함 시 기본급 부담을 덜어주어 구단 선호도 상승
  if(ns.incentive)prob+=0.10;
  // 에이전트 보유 시 협상력 보너스
  if(S.agent)prob+=0.15;
  return clamp(prob,0.12,0.96);
}

// 10. 시즌 성적 산출 및 타이틀 리더보드 생성
function leagueSize(){return CLUBS[S.league].length}
function playoffCut(){
  if(S.league==="KBO")return 5;
  if(S.league==="MLB")return 6;
  return 3;
}
function statRank(ov,bonus=0){
  const size=leagueSize()*12;
  return clamp(Math.round(1+(82-ov)*0.42+R(-5,5)-bonus),1,size);
}

const ageBase=a=>a<=18?6:a<=22?5.2:a<=25?3.6:a<=27?1.8:a<=29?.4:a<=31?-1.3:a<=33?-2.8:a<=35?-4.6:-6.5;
const physIdx=()=>S.type==="타"?[3,5]:[0,3];
const INJ={투:["어깨 염증","팔꿈치 염증","팔꿈치 인대 손상(토미존 수술)","어깨 관절와순 파열"],타:["햄스트링 부상","손목 부상","허리 디스크","무릎 인대 손상"]};
function rollInjury(am){
  const b=S.buff||{};
  let p=(am?.04:.08)+Math.max(0,S.age-29)*.009+(S.type==="투"?.02:0);
  if(b.rehab)p*=.35;if(b.half)p*=.6;if(b.risky)p+=.18;
  if(Math.random()>=clamp(p,0,.6))return null;
  const r=Math.random(),lv=am?(r<.2?2:1):(r<.08?3:r<.32?2:1);
  const nm=lv===1?(S.type==="투"?"어깨 뻐근함":"근육통"):INJ[S.type][lv===3?2+Math.floor(Math.random()*2):Math.floor(Math.random()*2)];
  return {lv,name:nm};
}
function seasonForm(){
  let f=(Math.random()+Math.random()+Math.random()-1.5)*2*3.2,slump=false;
  if(S.mate)f+=S.mate.bond*.5;
  const r=Math.random();
  if(r<clamp(.19-(S.type==="투"?S.st[4]:S.st[2])/700,.06,.14)){f-=R(6,12);slump=true}else if(r>.92)f+=R(3,6);
  if(S.slump>0){f-=R(4,8);slump=true}
  return {f,slump};
}
function growStats(inj,stall){
  const a=S.age,base=ageBase(a),ph=physIdx(),pf=clamp(.45+ovr(S)/90,.45,1.2),dmg=[0,0,0,0,0,0];
  if(inj&&inj.lv>=2){
    const n=inj.lv===2?2:3,lo=inj.lv===2?2:4,hi=inj.lv===2?4:9,bag=[0,1,2,3,4,5,...ph,...ph].sh(),pk=[];
    for(const i of bag){if(!pk.includes(i))pk.push(i);if(pk.length>=n)break}
    pk.forEach(i=>dmg[i]=Math.round(R(lo,hi)));
  }
  const cu=S.buff&&S.buff.cushion;
  S.st=S.st.map((v,i)=>{
    let g;
    if(base>0){g=base*pf*R(.4,1.5)*clamp((S.pot-v)/14,.12,1)*(v>=70?.7:1);g+=focusBonus(i)*.6*clamp(base/4,.3,1)}
    else{g=base*R(.6,1.55)*(ph.includes(i)?1.35:.75);g+=focusBonus(i)*.3;if(a>=33&&ph.includes(i)&&Math.random()<.25)g-=R(2,6)}
    if(stall||(inj&&inj.lv>=2))g=Math.min(g,0);else if(inj)g*=.5;
    g-=dmg[i];
    if(g<0&&cu)g=Math.min(0,g+1.5);
    return clamp(Math.round(v+g),10,Math.max(S.pot,v));
  });
}

const LG_G={MLB:162,NPB:143,KBO:144,CPBL:120,LIDOM:50};
const LG_GS={MLB:32,NPB:26,KBO:29,CPBL:24,LIDOM:10};
const BIG_AWARD={
  pit:{MLB:"사이영상",KBO:"최동원상",NPB:"사와무라상",CPBL:"최우수 투수상",LIDOM:"올해의 투수상"},
  bat:{MLB:"실버슬러거",KBO:"KBO 최고 타자상",NPB:"베스트나인",CPBL:"최우수 타자상",LIDOM:"올해의 타자상"}
};
function bigAwStr(){
  const e=Object.entries((S&&S.bigAw)||{});
  return e.length?" · "+e.map(([k,v])=>`${k} ${v}회`).join(" · "):"";
}
function isQualified(st){
  const mg=LG_G[S.league]||50;
  return S.type==="타"?st.PA>=mg*3.1:st.IP>=mg;
}
function bigAwardChance(st,qual){
  if(!qual)return 0;
  if(S.type==="타")return clamp((st.OPS-.90)*3.0,0,.7);
  return st.ERA<=3.0?clamp((3.35-st.ERA)*.5,0,.7):0;
}

function makeBatterStats(ov,gm){
  const pa=Math.round(gm*R(3.65,4.25)),bb=Math.round(pa*clamp(.065+S.st[2]/1500,.07,.16));
  const hbp=Math.round(pa*.012),sf=Math.round(pa*.025),ab=Math.max(1,pa-bb-hbp-sf);
  const q=clamp((ov-40)/59,0,1);
  const avg=clamp(.205+q*.145+(S.st[0]-ov)*.0007+R(-.025,.025),.17,.37);
  const hits=Math.min(ab,Math.round(ab*avg));
  const hrRate=Math.pow(clamp((S.st[1]-15)/84,0,1),1.3)*.30*R(.8,1.2);
  const hr=Math.max(0,Math.min(Math.round(gm*hrRate),Math.round(hits*.42)));
  const doubles=Math.round(Math.max(0,hits-hr)*R(.16,.25)),triples=Math.round(Math.max(0,hits-hr-doubles)*R(.025,.06));
  const rbi=Math.round(hr*R(1.6,2.3)+(hits-hr)*R(.22,.42)),runs=Math.round(hits*.48+hr*.55+bb*.3);
  const so=Math.round(ab*clamp(.19+(S.st[1]-S.st[0])*.002+R(-.03,.03),.08,.34));
  const sb=Math.round(gm*(S.st[3]/100)*R(.02,.2));
  const obp=(hits+bb+hbp)/(ab+bb+hbp+sf),slg=(hits+doubles+2*triples+3*hr)/ab;
  const ops=obp+slg,war=clamp((ov-43)/11+gm/140*.7+(ops-.7)*2+R(-.7,.7),-1,10);
  return {G:gm,PA:pa,AB:ab,H:hits,"2B":doubles,"3B":triples,HR:hr,RBI:rbi,R:runs,BB:bb,SO:so,SB:sb,AVG:hits/ab,OBP:obp,SLG:slg,OPS:ops,WAR:war};
}

function makePitcherStats(ov,injured){
  const lg=S.league,mg=LG_G[lg]||50,maxGS=LG_GS[lg]||10;
  const q=clamp((ov-40)/59,0,1),sp=S.role!=="RP",hurt=typeof injured==="number"?injured:(injured?R(.55,.8):1);
  let g,gs,ip;
  if(sp){
    gs=Math.max(1,Math.round(maxGS*(.3+.7*clamp((ov-38)/40,0,1))*R(.9,1)*hurt));
    const perStart=4.3+2.4*Math.pow(q,.8)+R(-.25,.25)+clamp((S.st[3]-ov)*.012,-.6,.6);
    const relief=Math.round(R(0,2));
    g=gs+relief;
    ip=gs*perStart+relief*R(.8,1.3);
  }else{
    gs=0;
    g=Math.max(5,Math.round(mg*.4*(.55+.45*q)*R(.9,1.05)*hurt));
    ip=g*R(.95,1.1);
  }
  ip=Math.min(ip,mg*1.4);
  const era=clamp(6.0-q*3.75+R(-.55,.55),1.45,8.5)*(sp?1:.95);
  const k9=clamp(4.0+(S.st[0]*.55+S.st[2]*.45-25)*.1,3.2,12.5)*R(.92,1.08)+(sp?0:.9);
  const bb9=clamp(5.0-(S.st[1]-25)*.046,1.5,5.6)*R(.9,1.1);
  const so=Math.round(ip*k9/9),bb=Math.round(ip*bb9/9);
  const whip0=.62+era*.16+R(-.04,.04);
  const hits=Math.max(Math.round(ip*.55),Math.round(whip0*ip-bb));
  const hr=Math.round(ip/9*clamp(.4+(era-2.2)*.2,.3,1.5)*R(.85,1.15));
  const er=ip*era/9;
  const wp=clamp(.5+(4.4-era)*.1+R(-.06,.06),.2,.85);
  const dec=sp?Math.round(gs*R(.72,.85)):Math.round(g*R(.1,.16));
  const wins=Math.round(dec*wp),losses=Math.max(0,dec-wins);
  const war=clamp((ip/9)*(4.6-era)/9.5+ip/200*.9+R(-.3,.3),-1.5,9);
  return {G:g,GS:gs,W:wins,L:losses,IP:+ip.toFixed(1),H:hits,HR:hr,BB:bb,SO:so,ER:Math.round(er),ERA:era,WHIP:(hits+bb)/ip,WAR:war};
}

function buildLeaderboards(stats,qual){
  const leaguePool=RIVAL_PLAYERS[S.league]||RIVAL_PLAYERS.KBO;
  const isBat=(S.type==="타");

  const sc=(LG_G[S.league]||50)/144;

  if(isBat){
    const avgList=[
      {name:S.name, val:qual?stats.AVG:0, isMe:true},
      {name:pool[0], val:+R(0.326,0.354).toFixed(3), isMe:false},
      {name:pool[1], val:+R(0.315,0.334).toFixed(3), isMe:false},
      {name:pool[2], val:+R(0.306,0.321).toFixed(3), isMe:false}
    ].sort((a,b)=>b.val-a.val).slice(0,3).map((x,idx)=>({...x, rank:idx+1, display:(x.isMe?stats.AVG:x.val).toFixed(3).replace(/^0/,"")}));

    const hrList=[
      {name:S.name, val:stats.HR, isMe:true},
      {name:pool[3], val:Math.round(R(31,42)*sc), isMe:false},
      {name:pool[4], val:Math.round(R(26,35)*sc), isMe:false},
      {name:pool[5], val:Math.round(R(22,30)*sc), isMe:false}
    ].sort((a,b)=>b.val-a.val).slice(0,3).map((x,idx)=>({...x, rank:idx+1, display:`${x.val}개`}));

    return [
      {key:"타율왕",title:"🔥 타율왕 (AVG) TOP 3", list:avgList},
      {key:"홈런왕",title:"💥 홈런왕 (HR) TOP 3", list:hrList}
    ];
  } else {
    const eraList=[
      {name:S.name, val:qual?stats.ERA:99, isMe:true},
      {name:pool[0], val:+R(2.08,2.52).toFixed(2), isMe:false},
      {name:pool[1], val:+R(2.42,2.82).toFixed(2), isMe:false},
      {name:pool[2], val:+R(2.72,3.08).toFixed(2), isMe:false}
    ].sort((a,b)=>a.val-b.val).slice(0,3).map((x,idx)=>({...x, rank:idx+1, display:(x.isMe?stats.ERA:x.val).toFixed(2)}));

    const soList=[
      {name:S.name, val:stats.SO, isMe:true},
      {name:pool[3], val:Math.round(R(175,212)*sc), isMe:false},
      {name:pool[4], val:Math.round(R(155,184)*sc), isMe:false},
      {name:pool[5], val:Math.round(R(140,164)*sc), isMe:false}
    ].sort((a,b)=>b.val-a.val).slice(0,3).map((x,idx)=>({...x, rank:idx+1, display:`${x.val}K`}));

    return [
      {key:"평균자책점왕",title:"🛡️ 평균자책점왕 (ERA) TOP 3", list:eraList},
      {key:"탈삼진왕",title:"⚡ 탈삼진왕 (SO) TOP 3", list:soList}
    ];
  }
}

// 11. 1년 시뮬레이션 게이지 & 시즌 중 중대 갈림길 선택지

function resumeSimTimer(){
  if(simTimer){clearInterval(simTimer);simTimer=null;}
  const stages=S.phase==="pro"?PRO_STAGES:AMATEUR_STAGES;
  simTimer=setInterval(()=>{
    // 프로 시즌 4단계(올스타 브레이크 이후)에서 확률적으로 시즌 중 갈림길 발동
    if(S.phase==="pro"&&S.simStep===4&&!S.midTriggered&&Math.random()<0.42){
      S.midTriggered=true;
      clearInterval(simTimer);simTimer=null;
      S.ev=pickMidSeasonCrossroad();
      S.ev.after=()=>resumeSimTimer();
      render();
      return;
    }
    S.simStep++;
    if(S.simStep>stages.length){
      S.simStep=stages.length;
      S.simDone=true;
      clearInterval(simTimer);
      simTimer=null;
      render();
      return;
    }else{
      S.simFeed.push(stages[S.simStep-1]);
      render();
    }
  },520);
}

function startSeasonSim(fast=false){
  if(simTimer){clearInterval(simTimer);simTimer=null;}
  const stages=S.phase==="pro"?PRO_STAGES:AMATEUR_STAGES;
  S.midChoice=null;
  S.midTriggered=false;

  if(fast){
    // 빠른 진행에서도 프로 시즌 32% 확률로 중대 갈림길 이벤트 발생
    if(S.phase==="pro"&&Math.random()<0.32){
      S.ev=pickMidSeasonCrossroad();
      S.ev.after=()=>finishProSeason();
      render();
      return;
    }
    if(S.phase==="pro")finishProSeason();
    else finishAmateurSeason();
    return;
  }
  S.screen="simulating";
  S.simStep=1;S.simDone=false;
  S.simFeed=[stages[0]];
  render();
  resumeSimTimer();
}

function finishAmateurSeason(){
  const o=ovr(S),inj=rollInjury(true),injured=!!inj;
  const currentStageLabel=lab(o);
  growStats(inj,false);
  const n=ovr(S),g=S.phase==="college"?40:30;
  let line;
  if(S.type==="타"){
    const avg=clamp(.19+n*.0014+R(-.02,.02),.15,.4);
    const ab=Math.round(g*3.6);
    const hr=Math.round(S.st[1]/6*(g/140)*R(.5,1.3));
    S.hit=(S.hit||0)+Math.round(ab*avg);
    S.ab=(S.ab||0)+ab;
    S.hr=(S.hr||0)+hr;
    line=`${g}경기 타율 ${avg.toFixed(3).replace(/^0/,"")} · ${hr}홈런`;
  } else {
    const era=clamp(6.5-n*.05+R(-.6,.6),1,9);
    const w=Math.round(g*.1*(n/50)*R(.5,1.2));
    const k=Math.round(n*g*.02*R(.8,1.2));
    S.w=(S.w||0)+w;
    S.k=(S.k||0)+k;
    line=`${g}경기 ${w}승 · 평균자책 ${era.toFixed(2)} · ${k}삼진`;
  }
  S.log.unshift(`<b>${S.age}세 (${currentStageLabel})</b> · 오버롤 ${n} · ${line}${injured?" <span class='bad'>(부상)</span>":""}`);
  const wasYouth=S.phase==="youth",yrDone=S.yr;
  S.age++;
  S.yr++;
  S.screen="career";
  if((S.phase==="youth"&&S.age>=19)||(S.phase==="college"&&S.age>=23)){
    toDraft(n);
  }
  if(wasYouth&&yrDone===3)startIntl(INTL.u18,"amateur");
  render();
}

function finishProSeason(){
  const age=S.age,rawOld=ovr(S),oldOvr=rawOld-(LGD[S.league]||0),before=S.st.slice();
  const prev=(S.yearStats||[]).slice(-1)[0],pa=prev?(prev.awards||[]):[];
  const mc=S.midChoice||{};

  let inj=rollInjury(false);
  if(mc.type==="push"){
    inj={lv:2,name:"진통제 투혼 후유증"};
  }else if(mc.type==="surgery"){
    inj={lv:3,name:"시즌 중 조기 수술 및 재활"};
  }

  const fm=seasonForm();
  if(mc.formMod)fm.f+=mc.formMod;
  const eff=clamp(oldOvr+fm.f,28,99);
  const maxGames=LG_G[S.league]||50;
  let hm=inj?[1,.85,.55,.18][inj.lv]:1;
  if(mc.type==="push")hm=0.92;
  if(mc.gamesRatio)hm=mc.gamesRatio;

  const gm=clamp(Math.round(games(eff)/140*maxGames*hm),1,maxGames);
  const stats=S.type==="타"?makeBatterStats(eff,gm):makePitcherStats(eff,hm);

  // 조기 수술 선택 시 능력치 하락 방어
  growStats(mc.protectStats?null:inj,fm.slump);
  if(S.slump>0)S.slump--;
  if((inj&&inj.lv===3&&!mc.protectStats)||mc.slumpRisk){
    S.slump=Math.max(S.slump||0,mc.slumpRisk?1:(Math.random()<.5?1:2));
  }
  S.buff=null;
  S.midChoice=null;

  const newOvr=ovr(S),statQ=isQualified(stats);
  const teamRank=clamp(Math.round(R(1,leagueSize()+1)+(65-eff)*.035+(mc.rankBonus||0)),1,leagueSize());
  const qualified=teamRank<=playoffCut();
  const ranks=S.type==="타"
    ?{타율:statRank(eff,stats.AVG>.31?3:0),안타:statRank(eff,stats.H/Math.max(1,gm)>1?2:0),홈런:statRank(eff,stats.HR/Math.max(1,gm)>.2?3:0),타점:statRank(eff),WAR:statRank(eff,stats.WAR>5?3:0)}
    :{평균자책:statRank(eff,stats.ERA<3?3:0),승리:statRank(eff,stats.W>15?3:0),탈삼진:statRank(eff,stats.SO/Math.max(1,stats.IP)>.9?3:0),WHIP:statRank(eff,stats.WHIP<1.15?3:0),WAR:statRank(eff,stats.WAR>5?3:0)};
  const leaderboards=buildLeaderboards(stats,statQ);

  const awards=[],comp=R(.55,1.1);
  let bigAward=null;
  const bigName=(BIG_AWARD[S.type==="타"?"bat":"pit"]||{})[S.league];
  if(bigName&&Math.random()<bigAwardChance(stats,statQ)*comp*(prev&&prev.bigAward?.6:1)){
    bigAward=bigName;awards.push(bigName);
    S.bigAw=S.bigAw||{};S.bigAw[bigName]=(S.bigAw[bigName]||0)+1;
    S.log.unshift(`<b>${age}세</b> 🏆 <span class="gold">${bigName}</span> 수상!`);
  }
  leaderboards.forEach(lb=>{if(lb.key&&lb.list[0]&&lb.list[0].isMe)awards.push(lb.key)});
  if(Math.random()<(statQ?clamp((eff-60)/110,0,.3)*(pa.includes("골든글러브")?.8:1)*Math.min(1,comp+.2):0))awards.push("골든글러브");
  const mp=(S.type==="타"?1:.4)*(pa.includes("리그 MVP")?.55:1)*comp;
  if(stats.WAR>=5.5&&Math.random()<.6*mp){awards.push("리그 MVP");S.mvp++}
  else if(stats.WAR>=4.5&&Math.random()<.3*mp){awards.push("리그 MVP");S.mvp++}
  else if(stats.WAR>=3.5&&Math.random()<.3)awards.push("리그 MVP 후보");
  if(!(S.yearStats||[]).length&&age<=26&&(statQ||stats.WAR>=2.5)&&Math.random()<clamp(.1+stats.WAR*.09,0,.6))awards.push("신인왕");
  if(statQ&&Math.random()<clamp((eff-58)/30,0,.8))awards.push("올스타");
  const extra=awards.filter(a=>a!==bigAward);
  if(extra.length)S.log.unshift(`<b>${age}세</b> 🏅 ${extra.join(", ")}`);
  if(inj)S.log.unshift(`<b>${age}세</b> <span class="bad">🚑 ${inj.name} (${["","경미","중상","시즌 아웃급"][inj.lv]})</span>`);

  // 성적 인센티브 옵션 정산
  let incentiveEarned=0;
  if(S.contractOpts&&S.contractOpts.incentive){
    let mult=0;
    if(awards.includes("리그 MVP"))mult+=0.35;
    if(bigAward)mult+=0.25;
    if(awards.includes("골든글러브"))mult+=0.15;
    if(awards.some(a=>TTL.includes(a)))mult+=0.15;
    if(statQ)mult+=0.10;
    if(mult>0){
      incentiveEarned=Math.round(salK()*mult);
      S.cash=(S.cash||0)+incentiveEarned;
      S.log.unshift(`<b>${age}세</b> 💰 <span class="gold">성적 인센티브 옵션 달성! (+${fmtCash(incentiveEarned)})</span>`);
    }
  }

  const teamWins=clamp(Math.round(maxGames*(.48+(leagueSize()-teamRank)*.008)+R(-9,9)),0,maxGames);
  const teamLosses=maxGames-teamWins;
  const record={age,year:S.yr,team:S.team,league:S.league,stats,ranks,teamRank,teamWins,teamLosses,qualified,awards,incentiveEarned,injured:!!inj,injLv:inj?inj.lv:0,injury:inj?inj.name:null,form:Math.round(fm.f),champion:false,playoffGames:[],leaderboards,bigAward,before,after:S.st.slice(),ovrBefore:rawOld,ovrAfter:newOvr};
  S.seasonRecord=record;S.cash=(S.cash||0)+Math.round((S.salary||0)*(FX[S.league]||1)*.38);
  S.yearStats=S.yearStats||[];
  S.yearStats.push(record);
  S.log.unshift(`<b>${age}세</b> ${S.team} 정규시즌 종료 · ${teamRank}위 · ${qualified?"포스트시즌 진출":"시즌 종료"}`);
  S.age++;
  S.yr++;
  if(S.contractRemaining>0)S.contractRemaining--;
  if(qualified){
    S.po=initPlayoffBracket(teamRank);
    S.screen="playoff";
  }else{
    S.screen="summary";
  }
  render();
}

// 12. 포스트시즌 및 문자 중계
function initPlayoffBracket(teamRank){
  const rivals=CLUBS[S.league].filter(t=>t!==S.team).sh();
  let idx=0;
  const pickRival=()=>rivals[(idx++)%rivals.length];

  if(S.league==="KBO"){
    const steps=[
      {name:"와일드카드 결정전", needWins:2, maxGames:2, advantage:teamRank===4?1:0, note:teamRank===5?"5위 진출: 2연승 필요 (1패 시 탈락)":"4위 진출: 1승 어드밴티지 보유 (1승 시 진출)"},
      {name:"준플레이오프", needWins:3, maxGames:5, advantage:0, note:"5전 3선승제"},
      {name:"플레이오프", needWins:3, maxGames:5, advantage:0, note:"5전 3선승제"},

function buildPlayoffGameScript(ctx){
  const po=ctx||S.po;
  const gameNo=po.games.filter(g=>g.round===po.roundName).length+1;
  const ov=ovr(S);
  const pool=RIVAL_PLAYERS[S.league]||RIVAL_PLAYERS.KBO;
  const mates=[...((ctx&&NAMES[po.myName])||pool.bat)].sh();
  const foes=[...((ctx&&NAMES[po.opponent])||pool.bat)].sh();

  const myInnings=[],oppInnings=[],events=[];
  let myScore=0,oppScore=0;
  const winProb=ctx?ctx.wp:clamp(.44+(ov-62)*.006,.3,.6);
  const ip=S.type==="투"?Math.round(R(5,8)):0;

  for(let inn=1;inn<=9;inn++){
    let oppR=0;
    if(Math.random()<(1-winProb)*0.48){
      oppR=Math.random()<0.25?2:1;
      oppScore+=oppR;
      const batter=foes[inn%foes.length];
      if(S.type==="투"&&inn<=ip&&Math.random()<0.55){
        events.push({inn:`${inn}회초`, text:`${batter}에게 안타 허용 후 적시타로 ${oppR}실점합니다. (${myScore}:${oppScore})`, type:"bad"});
      } else {
        events.push({inn:`${inn}회초`, text:`상대 ${batter}의 적시타! ${po.opponent}가 ${oppR}점을 뽑아냅니다. (${myScore}:${oppScore})`, type:"bad"});
      }
    } else {
      if(S.type==="투"&&inn<=ip&&Math.random()<0.65){
        const strikeoutBatter=foes[(inn+2)%foes.length];
        events.push({inn:`${inn}회초`, text:`⚡ <b>${S.name}</b>, ${strikeoutBatter}를 헛스윙 삼진 아웃 처리하며 무실점 이닝!`, type:"hero"});
      } else if(Math.random()<0.22){
        events.push({inn:`${inn}회초`, text:`유격수 앞 병살타 유도! 위기 없이 이닝을 마칩니다.`, type:"normal"});
      } else {
        events.push({inn:`${inn}회초`, text:`삼자범퇴로 깔끔하게 상대 타선을 막아냅니다.`, type:"normal"});
      }
    }
    oppInnings.push(oppR);

    if(inn===9&&myScore>oppScore){
      myInnings.push("X");
      events.push({inn:"9회말", text:`🎉 리드를 지켜내며 그대로 경기 종료! (${myScore}:${oppScore})`, type:"hero"});
      break;
    }

    let myR=0;
    if(Math.random()<winProb*0.52){
      const bigHit=Math.random()<0.28;
      myR=bigHit?(Math.random()<0.4?3:2):1;
      myScore+=myR;
      if(S.type==="타"&&Math.random()<0.65){
        if(bigHit){
          events.push({inn:`${inn}회말`, text:`🔥 <b>${S.name}</b>, 담장을 넘기는 결정적인 ${myR}점 홈런!! (${myScore}:${oppScore})`, type:"hero"});
        } else {
          events.push({inn:`${inn}회말`, text:`🔥 <b>${S.name}</b>, 좌중간을 가르는 적시 안타! 1타점을 올립니다! (${myScore}:${oppScore})`, type:"hero"});
        }
      } else {
        const mate=mates[inn%mates.length];
        events.push({inn:`${inn}회말`, text:`${mate}의 우전 안타와 상대 유격수 송구 실책이 겹치며 ${myR}득점! (${myScore}:${oppScore})`, type:"normal"});
      }
    } else {
      if(S.type==="타"&&Math.random()<0.45){
        events.push({inn:`${inn}회말`, text:`<b>${S.name}</b> 잘 맞은 타구가 상대 호수비에 잡히며 아쉽게 물러납니다.`, type:"normal"});
      } else if(Math.random()<0.2){
        events.push({inn:`${inn}회말`, text:`주자 출루했으나 후속타 불발로 득점 없이 이닝 종료.`, type:"normal"});
      } else {
        events.push({inn:`${inn}회말`, text:`상대 투수의 호투에 막혀 삼자범퇴로 물러납니다.`, type:"normal"});
      }
    }
    myInnings.push(myR);
  }

  if(myScore===oppScore){
    if(Math.random()<winProb){
      myScore++;myInnings.push(1);oppInnings.push(0);
      const heroName=S.type==="타"?S.name:mates[0];
      events.push({inn:"연장 10회말", text:`🎆 연장 혈투 끝 <b>${heroName}</b>의 끝내기 적시타!! 극적인 승리를 거둡니다! (${myScore}:${oppScore})`, type:"hero"});
    } else {
      oppScore++;myInnings.push(0);oppInnings.push(1);
      events.push({inn:"연장 10회초", text:`연장 접전 끝에 아쉬운 결승점을 허용하며 패배합니다. (${myScore}:${oppScore})`, type:"bad"});
    }
  }

  const me=calcMe(events,oppInnings,ip,myScore>oppScore);
  return {me,round:po.roundName,game:gameNo,opponent:po.opponent,myInnings,oppInnings,myScore,oppScore,win:myScore>oppScore,events,cursor:0};
}

function startLive(po,fast,fin){
  if(poGameTimer){clearInterval(poGameTimer);poGameTimer=null;}
  if(!po.liveGame)po.liveGame=buildPlayoffGameScript(po===S.po?null:po);
  const lg=po.liveGame;
  if(fast){fin();return;}
  lg.cursor=1;lg.done=false;render();
  poGameTimer=setInterval(()=>{
    lg.cursor++;
    if(lg.cursor>=lg.events.length){lg.cursor=lg.events.length;lg.done=true;clearInterval(poGameTimer);poGameTimer=null;}
    render();
  },480);
}
function startPlayoffGameSim(fast=false){startLive(S.po,fast,finalizePlayoffGame)}
function skipLive(po){
  if(poGameTimer){clearInterval(poGameTimer);poGameTimer=null;}
  po.liveGame.cursor=po.liveGame.events.length;po.liveGame.done=true;render();
}
function calcMe(ev,oi,ip,win){
  const o=ovr(S),tag=`<b>${S.name}</b>`;
  if(S.type==="타"){
    const mine=ev.filter(e=>e.text.includes(tag)),hit=mine.filter(e=>/홈런|안타|끝내기/.test(e.text));
    const hr=hit.filter(e=>e.text.includes("홈런")).length;
    const rbi=hit.reduce((a,e)=>a+(e.text.includes("홈런")?+(e.text.match(/(\d)점 홈런/)||[0,1])[1]:1),0);
    const base=Math.round(R(3.6,4.6)),rem=Math.max(0,base-mine.length);
    let ex=0;for(let i=0;i<rem;i++)if(Math.random()<clamp(.18+(o-40)*.003,.15,.35))ex++;
    const ab=mine.length+rem,h=hit.length+ex;
    const so=Math.min(ab-h,Math.round((ab-h)*clamp(.15+(S.st[1]-S.st[0])*.002,.05,.4)*R(.6,1.4)));
    return {AB:ab,H:h,HR:hr,RBI:rbi,BB:Math.random()<.12?1:0,SO:so};
  }
  const er=oi.slice(0,ip).reduce((a,b)=>a+b,0),k=ev.filter(e=>e.text.includes("헛스윙 삼진")).length;
  return {IP:ip,ER:er,SO:k+Math.round(ip*R(.2,.6)),H:Math.round(ip*R(.6,1.1)),BB:Math.round(ip*R(.05,.3)),
    dec:win?(Math.random()<.7?"W":""):(er>=2&&Math.random()<.7?"L":"")};
}
function gameLine(m){
  return S.type==="타"?`${m.AB}타수 ${m.H}안타${m.HR?` ${m.HR}홈런`:""} ${m.RBI}타점`
    :`${m.IP}이닝 ${m.SO}삼진 ${m.ER}자책${m.dec==="W"?" · 승":m.dec==="L"?" · 패":""}`;
}
function addPost(t,m){
  const p=t.post=t.post||{G:0};p.G++;
  for(const k in m)if(typeof m[k]==="number")p[k]=(p[k]||0)+m[k];
  if(m.dec==="W")p.W=(p.W||0)+1;
  if(m.dec==="L")p.L=(p.L||0)+1;
}
function postText(p){
  if(!p)return "출전 기록 없음";
  const f3=v=>v.toFixed(3).replace(/^0/,"");
  return S.type==="타"
    ?`${p.G}경기 ${p.H}안타 ${p.HR}홈런 ${p.RBI}타점 · 타율 ${p.AB?f3(p.H/p.AB):".000"}`
    :`${p.G}경기 ${p.SO}삼진 · ${p.IP}이닝 · 평균자책점 ${p.IP?(p.ER*9/p.IP).toFixed(2):"0.00"} · ${p.W||0}승 ${p.L||0}패`;
}

function finalizePlayoffGame(){
  const po=S.po,lg=po.liveGame;
  if(!lg)return;
  if(lg.win)po.wins++;else po.losses++;

  const gameSummary={round:lg.round,game:lg.game,result:lg.win?"승리":"패배",score:`${lg.myScore}:${lg.oppScore}`,opponent:lg.opponent,line:gameLine(lg.me)};
  addPost(S.seasonRecord,lg.me);
  po.games.push(gameSummary);
  S.seasonRecord.playoffGames.push(gameSummary);
  po.liveGame=null;

  const curStep=po.steps[po.stepIdx];
  const isKboWc5=(S.league==="KBO"&&po.stepIdx===0&&curStep.advantage===0);
  const eliminated=(isKboWc5&&po.losses>=1)||(po.losses>=curStep.needWins);

  if(po.wins>=curStep.needWins){
    if(po.stepIdx>=po.steps.length-1){
      po.finished=true;po.champion=true;
      S.seasonRecord.champion=true;
      S.seasonRecord.awards.push("리그 우승");
      S.log.unshift(`<b>${S.age-1}세</b> 🏆 ${S.team} ${curStep.name} 우승!`);
      S.screen="summary";
    } else {
      po.stepIdx++;
      const nextStep=po.steps[po.stepIdx];
      po.roundName=nextStep.name;po.needWins=nextStep.needWins;po.maxGames=nextStep.maxGames;po.note=nextStep.note;
      po.wins=nextStep.advantage;po.losses=0;po.opponent=po.pickRival();
    }
  } else if(eliminated){
    po.finished=true;po.eliminated=true;S.screen="summary";
  }
  render();
}

const NATSTR={"일본":85,"미국":84,"도미니카공화국":83,"베네수엘라":78,"멕시코":76,"한국":74,"푸에르토리코":73,"쿠바":70,"캐나다":68,"대만":66,"네덜란드":63,"호주":62,"이탈리아":60,"파나마":58};
const INTL={wbc:{name:"월드 베이스볼 클래식 (WBC)",sel:52,ctr:66},p12:{name:"프리미어12",sel:48,ctr:62},u18:{name:"U-18 야구 월드컵",sel:36,ctr:45}};
function proIntl(y){return y%4===0?INTL.wbc:y%4===2?INTL.p12:null}
function intlStep(){
  const I=S.intl;
  I.roundName=I.rounds[I.round];I.opponent=I.opps[I.round];
  I.wp=clamp(.5+(NATSTR[I.myName]+(S.natBonus||0)-NATSTR[I.opponent])*.017+(ovr(S)-I.ctr)*.003,.06,.8);
}
function startIntl(ev,ctx){
  const c=S.nat==="기타"?"호주":S.nat,need=ev.sel+(NATSTR[c]-60)*.3;
  S.intl={ev:ev.name,ctx,myName:c,ctr:ev.ctr,need:Math.round(need),ok:ovr(S)+R(-4,4)>=need,
    opps:Object.keys(NATSTR).filter(x=>x!==c).sh(),round:0,
    rounds:["조별리그 1차전","조별리그 2차전","조별리그 3차전","준결승","결승"],
    games:[],wins:0,losses:0,over:false,result:"",liveGame:null};
  intlStep();S.screen="intl";
}
function finalizeIntlGame(){
  const I=S.intl,lg=I.liveGame;if(!lg)return;
  I.games.push({round:lg.round,opponent:lg.opponent,result:lg.win?"승리":"패배",score:`${lg.myScore}:${lg.oppScore}`,line:gameLine(lg.me)});
  addPost(I,lg.me);I.liveGame=null;
  lg.win?I.wins++:I.losses++;
  const r=I.round;let res=null;
  if(r===2&&I.wins<2)res="조별리그 탈락";
  else if(r>=3&&!lg.win)res=r===3?"4강 탈락":"준우승";
  else if(r===4)res="우승 🏆";
  if(res){
    I.over=true;I.result=res;(S.intlRes=S.intlRes||[]).push({ev:I.ev,res});S.natBonus=(S.natBonus||0)+(res==="우승 🏆"?4:r>=3?2:1);
    S.log.unshift(`<b>${S.age}세</b> ${I.ev} ${I.myName} 대표 · <span class="gold">${res}</span>`);
  }else{I.round++;intlStep();}
  render();
}
function exitIntl(){
  const c=S.intl.ctx;S.intl=null;
  if(c==="pro")afterSeason();else{S.screen="career";render();}
}
function finishSeasonReport(){
  const rec=S.seasonRecord;
  if(rec&&!rec.intlDone){
    rec.intlDone=true;
    const ev=proIntl(rec.year);
    if(ev){startIntl(ev,"pro");render();return;}
  }
  afterSeason();
}
function afterSeason(){
  if(S.done){retire();return;}
  makeOffers();addOverseas();
  if(S.offers.length)S.screen="offers";else{S.rejects=makeRejects();S.screen="nooffer"}
  render();
}

      title:`절망적인 부상을 딛고 다시 날아오른 불사조`,
      desc:`선수 생명을 위협받던 시즌 아웃급 대부상을 이겨내고 리그 정상급 타이틀을 탈환했습니다. 불굴의 의지로 수많은 이들에게 감동을 주었습니다.`

        <p class="hint" style="margin:0">${p.summary}</p>
      </div>
    `).join(""):"<p class='hint'>아직 은퇴한 선수가 없어요. 커리어를 마치고 명예의 전당에 이름을 남겨보세요!</p>"}
    <button type="button" class="go" id="closeHof">닫기</button>
  </div>`;
  document.body.appendChild(o);
  o.querySelector("#closeHof").onclick=()=>o.remove();
  o.querySelector("#impBtn").onclick=()=>{
    const p=o.querySelector("#impCode").value.trim().split("|");
    if(p[0]==="야구육성"&&p.length>=5&&+p[2]>0&&+p[2]<1e6&&p[4]===hsh("bb!"+p[1]+"|"+p[2]+"|"+p[3])){
      const h=getHof();h.rivals=(h.rivals||[]).filter(x=>x.name!==p[1]).concat([{name:esc(p[1].slice(0,10)),score:Math.round(+p[2]),rank:esc(p[3].slice(0,3))}]).slice(-30);
      try{localStorage.setItem(HOF_KEY,JSON.stringify(h))}catch(e){}
      o.remove();showHofModal();
    }else o.querySelector("#impMsg").textContent="코드가 올바르지 않거나 변조됐어요.";
  };
}

let lastKey="";
function render(){

function liveScreen(header,po,team,onDone,title){
  const lg=po.liveGame,A=document.getElementById("app"),cur=lg.cursor;
  const sh=lg.events.slice(0,cur),ev=sh[sh.length-1]||lg.events[0];
  const cols=Math.max(9,lg.oppInnings.length),hd=Array.from({length:cols},(_,i)=>`<th>${i+1}</th>`).join("");
  const oi=lg.done?cols:Math.ceil(cur/2),mi=lg.done?cols:Math.floor(cur/2);
  const cell=(a,n)=>Array.from({length:cols},(_,i)=>`<td>${i<n&&a[i]!==undefined?a[i]:"-"}</td>`).join("");
  const sum=(a,n)=>a.slice(0,n).reduce((x,y)=>x+(typeof y==="number"?y:0),0);
  A.innerHTML=header+`<div class="card"><h2>🏟️ ${title}</h2>
    <span class="inning-badge">${lg.done?"경기 종료":ev.inn+" 진행 중"}</span>
    <table class="scoreboard"><thead><tr><th>팀</th>${hd}<th>R</th></tr></thead><tbody>
      <tr><td class="team-col">${po.opponent}</td>${cell(lg.oppInnings,oi)}<td class="runs-col">${sum(lg.oppInnings,oi)}</td></tr>
      <tr><td class="team-col" style="color:var(--amber)">${team}</td>${cell(lg.myInnings,mi)}<td class="runs-col">${sum(lg.myInnings,mi)}</td></tr>
    </tbody></table>
    <div class="pbp-feed">${sh.map(e=>`<div class="pbp-item ${e.type==="hero"?"pbp-hero":e.type==="bad"?"pbp-bad":""}"><b>[${e.inn}]</b> ${e.text}</div>`).join("")}</div>
    <button type="button" class="go" id="lvBtn">${lg.done?"경기 결과 확인":"⚡ 빠르게 보기"}</button></div>`;
  document.getElementById("lvBtn").onclick=lg.done?onDone:()=>skipLive(po);
}

    `).join("");

    A.innerHTML=`<h1>${S.name}</h1><p class="sub">${record.age}세 시즌 결산 · ${LEAGUE_LABEL[S.league]} · ${record.team}</p>
    <div class="card"><h2>팀 성적</h2><p>정규시즌 <b class="gold">${record.teamRank}위</b> · ${record.teamWins}승 ${record.teamLosses}패<br>${record.qualified?(record.champion?"🏆 포스트시즌 우승!":"포스트시즌 진출"):"포스트시즌 진출 실패"}</p>${record.injury?`<p class='bad'>🚑 ${record.injury} (${["","경미한 부상","중상","시즌 아웃급 부상"][record.injLv]}) — ${record.injLv>=2?"능력치가 하락했어요.":"성장이 멈췄어요."}</p>`:""}${record.form<=-6?"<p class='bad'>📉 시즌 내내 슬럼프에 시달렸어요.</p>":record.form>=5?"<p class='gold'>📈 컨디션이 유독 좋은 시즌이었어요.</p>":""}${record.incentiveEarned?`<p class='gold'>💰 성적 인센티브 옵션 달성 보너스 +${fmtCash(record.incentiveEarned)} 지급!</p>`:""}</div>
    <div class="card"><h2>정규시즌 개인 성적</h2><p>${regLine}</p>${regGrid}</div>
    <div class="card"><h2>포스트시즌 개인 성적</h2>${postHtml}</div>
    ${growCard(record)}<div class="card"><h2>개인 수상</h2>${awards}</div>${reactCard2(record)}
    <div class="card"><h2>🏅 리그 주요 부문 TOP 3</h2>${top3Html}</div>
    <details class="card"><summary>상세 기록 (정규시즌)</summary><table class="report-table">${statRows}</table><h2 style="margin-top:14px">리그 순위</h2><table class="report-table">${rankRows}</table></details>
    ${record.playoffGames.length?`<details class="card"><summary>포스트시즌 경기별 기록</summary>${record.playoffGames.map(x=>`<div class="match">${x.round} · vs ${x.opponent}<br><b class="${x.result==="승리"?"gold":"bad"}">${x.result} ${x.score}</b> · ${x.line||""}</div>`).join("")}</details>`:""}
    <button type="button" class="go" id="nextOff">${S.done?"결산 완료 · 은퇴식 진행":"결산 완료 · 영입 시장으로"}</button>`;
    document.getElementById("nextOff").onclick=finishSeasonReport;
    return;
  }

  if(S.screen==="nooffer"){
    A.innerHTML=header+`<div class="card slim"><h2 style="font-size:18px">📭 도착한 제안이 없어요</h2><p>${S.waitNote?S.waitNote+"<br>":""}${S.age}세 · 오버롤 ${o}${S.unsigned?` · 무적 ${S.unsigned}년차`:""}. 이번 비시즌에는 어느 구단에서도 영입 제안이 오지 않았습니다.</p>${S.rejects.map(x=>`<div class="match"><b>${x.team}</b><br>${x.msg}</div>`).join("")}<button type="button" class="go" id="wt">🏃 무적 신분으로 개인 훈련하며 재도전</button><button type="button" style="width:100%;margin-top:10px;color:var(--bad)" id="rt2">은퇴를 선언한다</button><p class="hint">재도전해도 나이와 기량 하락으로 상황이 더 나빠질 수 있어요.</p></div>`;
    document.getElementById("wt").onclick=waitUnsigned;document.getElementById("rt2").onclick=retire;
    return;
  }

  // 화면 4: FA 시장 평가 & 영입 제안 협상 화면
  if(S.screen==="offers"){
    const fa=isFaYear();
    const faEval=fa?evaluateFaMarket():null;
    const faReportHtml=fa?`
      <div class="fa-grade-box">
        <div class="fa-grade-badge">${faEval.grade}</div>
        <div>
          <b style="font-size:17px;color:var(--chalk)">${faEval.title}</b>
          <p style="margin:2px 0;font-size:12.5px;color:var(--mute)">최근 WAR ${faEval.war} · 시장 예상가 ${salaryText(faEval.estSal,S.league)}</p>
        </div>
      </div>
      <p class="hint" style="margin:0 0 12px">${faEval.desc}</p>
    `:"";

    const list=S.offers.map((x,i)=>{
      const home=x.team===S.team&&!x.league,lgName=LEAGUE_LABEL[x.league||S.league];
      const optStr=optSummaryText(x.opts);
      return `<div class="offer${home?" home":""}">${emb(x.team)}<div><div class="tn">${x.team}</div><div class="lg">${lgName}${x.isFa?" · FA 오퍼":""}</div></div>
        <div class="pills">
          <span class="pill money">💰 ${salaryText(x.salary,x.league||S.league)}</span>
          <span class="pill">📅 ${x.years}년</span>
          <span class="pill">🎽 ${x.role}</span>
          ${optStr?`<span class="pill opt">${optStr}</span>`:""}
        </div>
        <div class="act">
          <button type="button" data-nego="${i}">📋 조건 협상</button>
          <button type="button" class="sel" data-offer="${i}">${home?"✍️ 즉시 재계약":"✈️ 즉시 이적"}</button>
        </div>
      </div>`;
    }).join("");

    A.innerHTML=header+`<div class="card slim"><h2 style="font-size:18px;margin-bottom:8px">${fa?"🎉 FA 시장 개장 · 스카우트 평가":"비시즌 · 계약 제안"}</h2>${faReportHtml}<div class="offers">${list}</div><p class="hint">조건 협상을 통해 연봉·기간은 물론 옵트아웃, 인센티브, 트레이드 거부권을 요구할 수 있어요.</p><button type="button" class="ghost" id="od">모두 거절하고 잔류</button></div>`;
    A.querySelectorAll("[data-offer]").forEach(b=>b.onclick=()=>chooseOffer(+b.dataset.offer));
    A.querySelectorAll("[data-nego]").forEach(b=>b.onclick=()=>openOfferNego(+b.dataset.nego));
    document.getElementById("od").onclick=declineOffers;
    return;
  }

  // 화면 5: 신인 드래프트 화면
  if(S.phase==="draft"){
    A.innerHTML=header+board+DRAFT();
    document.getElementById("dp").onclick=pro;
    const dc=document.getElementById("dc");
    if(dc)dc.onclick=college;
    return;
  }

  // 화면 6-A: 성대한 은퇴식 및 영구결번·히든엔딩 연출 화면
  if(S.screen==="ceremony"){
    const fs=finalScore(),rk=rankOf(fs.total);
    const endings=S.specialEndings||[];
    const hasLegend=!!S.perm||endings.length>0||fs.total>=1300;
    const bannerHtml=S.perm?`
      <div class="jersey-banner">
        <div class="jersey-team">${S.perm.team}</div>
        <div class="jersey-num">${S.jersey||7}</div>
        <div class="jersey-name">${S.name}</div>
      </div>
      <p class="gold" style="margin:6px 0 12px">🎊 구단 역사상 영원한 영구결번 지정! 🎊</p>
    `:`<div class="ending-emblem">${fs.total>=2000?"🏛️":fs.total>=1300?"👑":fs.total>=800?"⭐":"⚾"}</div>`;

    const endingCardsHtml=endings.length?endings.map(e=>`
      <div class="ending-card">
        <span class="sim-badge" style="margin-bottom:6px">${e.badge}</span>
        <h3>${e.title}</h3>
        <p>${e.desc}</p>
      </div>
    `).join(""):`
      <div class="ending-card">
        <h3>그라운드를 떠나는 아름다운 작별</h3>
        <p>${S.age}세까지 땀과 열정으로 그라운드를 누볐습니다. 팬들은 당신의 플레이를 오래도록 기억할 것입니다.</p>
      </div>
    `;

    A.innerHTML=`
    <div class="ceremony-stage ${hasLegend?"legend":""}">
      <div class="ceremony-sub">OFFICIAL RETIREMENT CEREMONY</div>
      <div class="ceremony-title">${S.name} 은퇴식</div>
      <p style="margin:0;font-size:14px;color:var(--mute)">${S.pos} · ${S.style} · ${S.age}세 은퇴 · 최종 등급 <b class="gold">${rk} (${grade()})</b></p>
      ${bannerHtml}
      ${endingCardsHtml}
      <button type="button" class="go" id="toFinalReport">📊 통산 성적 및 최종 점수표 보기</button>
    </div>`;
    document.getElementById("toFinalReport").onclick=()=>{S.screen="retired";render()};
    return;
  }

  // 화면 6-B: 은퇴 최종 결산 및 명예의 전당 등재
  if(S.done||S.screen==="retired"){
    if(S.perm===undefined){S.perm=permNo();if(S.perm)S.log.unshift(`<b>${S.age}세</b> 🎽 <span class="gold">${S.perm.team}, 영구결번 제의 (등번호 ${S.jersey||"?"}번)</span>`)}
    saveToHof();
    const tot=calcCareerTotals(S),fs=finalScore(),rk=rankOf(fs.total),code=(b=>b+"|"+hsh("bb!"+b.slice(5)))(`야구육성|${S.name.replace(/\|/g,'')}|${fs.total}|${rk}`);
    const endings=S.specialEndings||detectSpecialEndings(fs);
    const careerLine=S.type==="타"
      ?`통산 ${tot.G}경기 · 타율 ${tot.AB?(tot.H/tot.AB).toFixed(3).replace(/^0/,""):".000"} · ${tot.H}안타 · ${tot.HR}홈런 · ${tot.RBI}타점 · ${tot.SB}도루`
      :`통산 ${tot.G}경기 · ${tot.W}승 ${tot.L}패 · 평균자책점 ${tot.IP?(tot.ER*9/tot.IP).toFixed(2):"0.00"} · ${tot.IP.toFixed(1)}이닝 · ${tot.SO}삼진`;

    A.innerHTML=header+board+`
    <div class="card">
      <h2>은퇴 및 커리어 결산</h2>
      <p>${S.age}세에 정든 유니폼을 벗었습니다.<br>최종 평가: <b class="gold">${grade()}</b></p>
      <div class="acc" style="padding:12px;margin:12px 0">
        <b>📊 프로 통산 성적</b>
        <p style="margin:6px 0 0;font-size:14px">${careerLine}</p>
        <p class="hint" style="margin:4px 0 0">리그 우승 ${tot.champs}회 · 골든글러브 ${tot.gg}회 · MVP ${S.mvp}회${bigAwStr()}</p>
      </div>
      ${endings.map(e=>`<div class="award big">${e.badge} · ${e.title}<small>${e.desc}</small></div>`).join("")}
      <div class="award big">🏆 최종 점수 ${fs.total.toLocaleString("ko-KR")}점 · ${rk}등급<small>${grade()}</small></div>
      ${graphCard()}
      <table class="report-table">${fs.rows.map(r=>`<tr><td>${r.l}</td><td>+${r.v.toLocaleString("ko-KR")}</td></tr>`).join("")}</table>
      ${fs.ach.map(a=>`<div class="award">${a.n}<br><small style="color:var(--mute)">${a.d} · +${a.p}점</small></div>`).join("")}
      ${fs.hid?`<p class="hint">🔒 아직 잠겨 있는 히든 도전과제가 ${fs.hid}개 있어요.</p>`:""}
      <label for="scCode">점수 코드 (친구에게 보내 보세요)</label><input id="scCode" readonly value="${code}">
      <button type="button" class="small" id="cp">📋 점수 코드 복사</button>
      <button type="button" class="small" id="cardImg">🖼️ 결과 카드 이미지 저장</button>
      <button type="button" class="small" id="replayCeremony">🎬 은퇴식 연출 다시 보기</button>
      <button type="button" class="go" id="re">새 선수로 다시 시작</button>
      <button type="button" style="width:100%;margin-top:10px" id="openHofRet">🏛️ 명예의 전당 & 통산 기록실</button>
    </div>`+
    `<details class="card" open data-k="log"><summary>커리어 기록</summary>${logHtml()}</details>`;
    document.getElementById("re").onclick=()=>{S=null;P=null;render()};
    document.getElementById("replayCeremony").onclick=()=>{S.screen="ceremony";render();spawnConfetti()};
    document.getElementById("cp").onclick=e=>{const i=document.getElementById("scCode");i.select();try{navigator.clipboard.writeText(code)}catch(x){try{document.execCommand("copy")}catch(y){}}e.target.textContent="✅ 복사했어요"};
    document.getElementById("openHofRet").onclick=showHofModal;
    document.getElementById("cardImg").onclick=shareCard;
    return;
  }

  // 화면 7: 메인 커리어 육성 화면
  A.classList.add("has-dock");
  A.innerHTML=header+board+
    `<details class="card" open data-k="stat"><summary>📊 능력치 & 훈련</summary>${bars}${traitHtml}${slumpAlert}${trainHtml}</details>`+
    contract+
    `${shopCard()}`+
    `<details class="card" open data-k="log"><summary>커리어 기록</summary>${logHtml()}</details>`+
    `<div class="card" style="padding:12px">
      <div class="row">
        <button type="button" id="openHofMain">🏛️ 명예의 전당</button>
        <button type="button" id="snd" aria-label="효과음 켜기/끄기" style="flex:0 0 56px">${SND?"🔊":"🔇"}</button>
        ${S.phase==="pro"?'<button type="button" id="rt" style="color:var(--bad)">은퇴하기</button>':""}
      </div>
    </div>`;

  D.innerHTML=`<div class="bottom-dock">
    <div class="bottom-dock-inner">
      <button type="button" class="go" id="sn">${S.phase==="pro"?"⚾ 정규시즌 진행":"⚾ 시즌 진행"}</button>
      <button type="button" class="fast-btn" id="snFast">⚡ 빠른 진행</button>
    </div>
  </div>`;

  document.querySelectorAll("details.card").forEach(d=>{
    if(CL[d.dataset.k])d.open=false;
    d.ontoggle=()=>{CL[d.dataset.k]=!d.open};
  });
  A.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy));
  document.getElementById("sn").onclick=()=>goSeason(false);
  document.getElementById("snFast").onclick=()=>goSeason(true);
  document.getElementById("openHofMain").onclick=showHofModal;
  document.getElementById("snd").onclick=()=>{SND=!SND;try{localStorage.setItem("baseball_snd",SND?"1":"0")}catch(e){}fx("tap");render()};
  const optBtn=document.getElementById("btnOptOut");if(optBtn)optBtn.onclick=triggerOptOut;
  const ng=document.getElementById("nego");if(ng)ng.onclick=negotiateNow;
  const trBtn=document.getElementById("reqTrade");
  if(trBtn)trBtn.onclick=requestTrade;
  const rt=document.getElementById("rt");
  if(rt)rt.onclick=retire;
}

render();
</script>
</body>
</html>
